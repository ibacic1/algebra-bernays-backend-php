<!DOCTYPE html>
<html lang="hr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebShop - unos proizvoda</title>
        <link rel="stylesheet" href="css/stil.css">
    </head>
    <body>
        <header>
            <h1>WebShop</h1>
            <p>Dobro došli na našu web trgovinu</p>
        </header>

        <nav>
            <a href="index.html">Početna</a>
            <a href="kategorije.html">Kategorije</a>
            <a href="opisnekategorije.html">Opisne kategorije</a>
            <a href="proizvodi.html" class="active">Proizvodi</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>

        <main>
            <h2>Unos novog proizvoda</h2>

            <!-- HR: Forma za unos proizvoda
                      type="number" - dopušta samo brojeve
                      type="number" step="0.01" - dopušta decimalne brojeve (cijene)
                      <select> - padajući izbornik s opcijama
                 EN: Product entry form
                      type="number" - allows numbers only
                      type="number" step="0.01" - allows decimal numbers (prices)
                      <select> - dropdown menu with options -->
            <form action="" method="POST">

                <label>Naziv proizvoda:</label>
                <input type="text" name="naziv">

                <!-- HR: Padajući izbornik za odabir kategorije
                     EN: Dropdown for category selection -->
                <label>Kategorija:</label>
                <select>
                    <option>Elektronika</option>
                    <option>Odjeća</option>
                    <option>Knjige</option>
                </select>

                <label>Količina:</label>
                <input type="number">

                <!-- HR: step="0.01" omogućuje unos decimalnih vrijednosti
                     EN: step="0.01" allows entering decimal values -->
                <label>Cijena:</label>
                <input type="number" step="0.01">

                <button type="submit">Spremi</button>

            </form>
        </main>

        <footer>
            Copyright &copy; 2026 WebShop | Sva prava pridržana
        </footer>
    </body>
</html>
