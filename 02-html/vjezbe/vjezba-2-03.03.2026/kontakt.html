<!DOCTYPE html>
<html lang="hr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebShop - kontakt</title>
        <link rel="stylesheet" href="css/stil.css">
    </head>
    <body>
        <header>
            <h1>WebShop</h1>
            <p>Dobro došli na našu web trgovinu</p>
        </header>

        <nav>
            <a href="index.html">Početna</a>
            <a href="kategorije.html">Kategorije</a>
            <a href="opisnekategorije.html">Opisne kategorije</a>
            <a href="proizvodi.html">Proizvodi</a>
            <a href="kontakt.html" class="active">Kontakt</a>
        </nav>

        <main>
            <h2>Kontakt</h2>

            <!-- HR: Flexbox layout - kontakt-container dijeli stranicu na 2 dijela (forma + mapa)
                      Definirano u CSS-u s display:flex
                 EN: Flexbox layout - kontakt-container splits page into 2 parts (form + map)
                      Defined in CSS with display:flex -->
            <div class="kontakt-container">

                <div class="kontakt-forma">
                    <!-- HR: Kontakt forma - method="POST" znači podaci se šalju skriveno
                         EN: Contact form - method="POST" means data is sent hidden -->
                    <form action="" method="POST">
                        <label>Ime:</label>
                        <input type="text" name="ime">

                        <label>Email:</label>
                        <input type="email">

                        <label>Poruka:</label>
                        <!-- HR: textarea - višeredni unos teksta, cols=širina, rows=visina
                             EN: textarea - multi-line text input, cols=width, rows=height -->
                        <textarea name="poruka" cols="30" rows="11"></textarea>

                        <button type="submit">Pošalji</button>
                    </form>
                </div>

                <!-- HR: Google Maps iframe - ugrađena karta direktno u HTML
                          src sadrži embed URL s Google Maps-a
                     EN: Google Maps iframe - embedded map directly in HTML
                          src contains embed URL from Google Maps -->
                <div class="kontakt-mapa">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2781.0499924601672!2d15.938530877452814!3d45.81025717108165!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4765d6d74e265877%3A0x1a4f4eae9fc461c5!2sAlgebra%20University%20College!5e0!3m2!1sen!2shr!4v1772567526145!5m2!1sen!2shr" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>

            </div>
        </main>

        <footer>
            Copyright &copy; 2026 WebShop | Sva prava pridržana
        </footer>
    </body>
</html>
