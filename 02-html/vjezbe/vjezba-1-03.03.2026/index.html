<!DOCTYPE html>
<!-- HR: Deklaracija tipa dokumenta - govori pregledniku da je ovo HTML5
     EN: Document type declaration - tells the browser this is HTML5 -->
<html lang="hr">
    <head>
        <meta charset="UTF-8">
        <!-- HR: Viewport meta tag - stranica se prilagođava veličini ekrana (mobilni uređaji)
             EN: Viewport meta tag - page adapts to screen size (mobile devices) -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebShop - početna stranica</title>
        <!-- HR: CSS stilovi su direktno u <style> tagu - u vježbi 2 premjestit ćemo ih u posebnu datoteku
             EN: CSS styles are directly in <style> tag - in exercise 2 we will move them to a separate file -->
        <style>
            /* HR: Reset margina i font za cijelu stranicu
               EN: Reset margins and font for the whole page */
            body{
                font-family: Arial, Helvetica, sans-serif; 
                margin: 0; 
                background-color: #f4f4f4;
            }

            /* HR: Zaglavlje stranice - tamna pozadina, bijeli tekst
               EN: Page header - dark background, white text */
            header{
                background-color: #2c3e50;
                color: white;
                padding: 20px;
                text-align: center;
            }

            h1{
                font-size: 20px;
                text-decoration: underline;
                color: #e5eb9d;
            }

            /* HR: Navigacijska traka
               EN: Navigation bar */
            nav{
                background-color: #34495e;
                padding: 10px;
                text-align: center;
            }

            nav a{
                color: white;
                text-decoration: none;
                margin: 0 15px;
                font-weight: bold;
            }

            /* HR: Hover efekt na linkovima u navigaciji
               EN: Hover effect on navigation links */
            nav a:hover{
                color: #ED9785;
            }

            /* HR: Klasa za aktivnu (trenutnu) stranicu u navigaciji
               EN: Class for the active (current) page in navigation */
            .active{
                color: red;
            }

            main{
                padding: 20px;
            }

            footer{
                background-color: #2c3e50;
                color: white;
                padding: 15px;
                text-align: center;
                margin-top: 40px;
            }
        </style>
    </head>
    <body>
        <!-- HR: Zaglavlje s nazivom shopa i podnaslovom
             EN: Header with shop name and subtitle -->
        <header>
            <h1>WebShop</h1>
            <p>Dobro došli na našu web trgovinu</p>
        </header>

        <!-- HR: Navigacija - class="active" označava trenutnu stranicu
             EN: Navigation - class="active" marks the current page -->
        <nav>
            <a href="index.html" class="active">Početna</a>
            <a href="kategorije.html">Kategorije</a>
            <a href="opisnekategorije.html">Opisne kategorije</a>
            <a href="proizvodi.html">Proizvodi</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>

        <!-- HR: Glavni sadržaj stranice
             EN: Main page content -->
        <main>
            <h2>O nama</h2>
            <p>Prodajemo kvalitetne proizvode po najboljim cijenama</p>
        </main>

        <!-- HR: Podnožje stranice s copyright oznakom (&copy; = © simbol)
             EN: Page footer with copyright mark (&copy; = © symbol) -->
        <footer>
            Copyright &copy; 2026 WebShop | Sva prava pridržana
        </footer>
    </body>
</html>
